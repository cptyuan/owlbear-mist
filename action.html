<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; margin: 10px; background: #2f3437; color: #fff; }
    .section { margin-bottom: 15px; }
    .section h3 { margin: 5px 0; }
    .item { background: #3a3f44; padding: 5px 8px; margin: 4px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .delete-btn { background: #d9534f; border: none; color: white; padding: 2px 8px; border-radius: 3px; cursor: pointer; }
    .add-form { display: flex; gap: 5px; margin-top: 5px; }
    .add-form input { flex: 1; padding: 4px; border-radius: 3px; border: 1px solid #555; background: #1e1e1e; color: #fff; }
    .add-form button { background: #5cb85c; border: none; color: white; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
    .no-token { color: #888; font-style: italic; }
    .offset-control { display: flex; gap: 4px; margin-left: auto; }
    .offset-control input { width: 40px; padding: 2px; border-radius: 3px; border: 1px solid #555; background: #1e1e1e; color: #fff; text-align: center; }
    .offset-btn { background: #5bc0de; border: none; color: white; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="app">
    <div id="token-name" class="no-token">未选中任何 token</div>
    <div class="section">
      <h3>🏷️ 标签</h3>
      <div id="tags-list"></div>
      <div class="add-form">
        <input id="new-tag" placeholder="输入标签文本">
        <button id="add-tag-btn">添加</button>
      </div>
    </div>
    <div class="section">
      <h3>💚 状态</h3>
      <div id="statuses-list"></div>
      <div class="add-form">
        <input id="new-status-name" placeholder="状态名称">
        <input id="new-status-level" placeholder="等级 (1-7)" style="width:60px;">
        <button id="add-status-btn">添加</button>
      </div>
    </div>
    <div class="section">
      <h3>💜 威能</h3>
      <div id="powers-list"></div>
      <div class="add-form">
        <input id="new-power-name" placeholder="威能名称">
        <input id="new-power-level" placeholder="等级" style="width:50px;">
        <button id="add-power-btn">添加</button>
      </div>
    </div>
  </div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk";

    OBR.onReady(() => {
      // 颜色配置
      const COLORS = {
        tag: '#FF9800',
        status: '#8BC34A',
        power: '#9C27B0'
      };

      // DOM 元素
      const tokenNameEl = document.getElementById('token-name');
      const tagsListEl = document.getElementById('tags-list');
      const statusesListEl = document.getElementById('statuses-list');
      const powersListEl = document.getElementById('powers-list');

      // ----- 工具函数 -----
      async function getSelectedToken() {
        const selection = await OBR.player.getSelection();
        if (!selection || selection.length === 0) return null;
        const items = await OBR.scene.items.getItems(selection);
        return items?.[0] || null;
      }

      function getCustomLabels(item) {
        return item?.metadata?.['com.cptyuan.token-labels'] || { tags: [], statuses: [], powers: [] };
      }

      async function saveCustomLabels(item, labels) {
        await OBR.scene.items.updateItems([item.id], (items) => {
          const target = items[0];
          if (!target) return;
          if (!target.metadata) target.metadata = {};
          target.metadata['com.cptyuan.token-labels'] = labels;
        });
      }

      // 状态槽位逻辑
      function addStatusLevel(existingLevels, newLevel) {
        if (newLevel < 1 || newLevel > 7) return null;
        const levels = new Set(existingLevels);
        if (!levels.has(newLevel)) {
          levels.add(newLevel);
          return Array.from(levels).sort((a,b) => a-b);
        }
        for (let i = newLevel + 1; i <= 7; i++) {
          if (!levels.has(i)) {
            levels.add(i);
            return Array.from(levels).sort((a,b) => a-b);
          }
        }
        return null;
      }

      // 格式化状态文本（用于面板显示）
      function formatStatus(status) {
        const levels = status.levels.slice().sort((a,b) => a-b);
        if (levels.length === 0) return status.name;
        return `${status.name} - [${levels.join(',')}]`;
      }

      // 生成附件文本（用于实际显示在 token 旁）
      function getAttachmentText(type, data) {
        if (type === 'tag') return data.text;
        if (type === 'power') return `${data.name}-${data.level}`;
        // 状态：最高级大号，其他小号（通过 HTML 实现）
        if (type === 'status') {
          const levels = data.levels.slice().sort((a,b) => a-b);
          if (levels.length === 0) return data.name;
          const highest = levels.pop();
          const lower = levels.join('');
          let html = `${data.name}-`;
          if (lower) html += `<span style="font-size:0.7em;opacity:0.6;">${lower}</span>`;
          html += `<strong>${highest}</strong>`;
          return html;
        }
        return '';
      }

      // ----- 附件管理 -----
      // 删除 token 上所有属于我们扩展的附件
      async function removeAllAttachments(tokenId) {
        const attachments = await OBR.scene.items.getAttachments(tokenId);
        for (const att of attachments) {
          if (att.metadata?.['com.cptyuan.token-labels.attachment']) {
            await OBR.scene.items.deleteAttachments([att.id]);
          }
        }
      }

      // 根据当前标注数据重建附件
      async function rebuildAttachments(token) {
        // 先清除旧附件
        await removeAllAttachments(token.id);
        
        const labels = getCustomLabels(token);
        const attachments = [];

        // 标签附件
        for (const tag of labels.tags) {
          attachments.push({
            type: 'LABEL',
            visible: true,
            text: getAttachmentText('tag', tag),
            style: {
              backgroundColor: COLORS.tag,
              color: '#000',
              padding: '2px 6px',
              borderRadius: '4px',
              fontSize: '14px',
              fontWeight: 'normal',
              textAlign: 'center'
            },
            position: { x: 50, y: -30 }, // 初始位置，可拖动
            metadata: { 'com.cptyuan.token-labels.attachment': 'tag' }
          });
        }

        // 状态附件
        for (const status of labels.statuses) {
          attachments.push({
            type: 'LABEL',
            visible: true,
            text: getAttachmentText('status', status),
            style: {
              backgroundColor: COLORS.status,
              color: '#000',
              padding: '2px 6px',
              borderRadius: '4px',
              fontSize: '14px',
              fontWeight: 'normal',
              textAlign: 'center'
            },
            position: { x: -50, y: -30 },
            metadata: { 'com.cptyuan.token-labels.attachment': 'status' }
          });
        }

        // 威能附件
        for (const power of labels.powers) {
          attachments.push({
            type: 'LABEL',
            visible: true,
            text: getAttachmentText('power', power),
            style: {
              backgroundColor: COLORS.power,
              color: '#000',
              padding: '2px 6px',
              borderRadius: '4px',
              fontSize: '14px',
              fontWeight: 'normal',
              textAlign: 'center'
            },
            position: { x: 50, y: 30 },
            metadata: { 'com.cptyuan.token-labels.attachment': 'power' }
          });
        }

        // 批量创建附件
        if (attachments.length > 0) {
          await OBR.scene.items.createAttachments(token.id, attachments);
        }
      }

      // ----- 面板刷新（同时触发附件重建）-----
      async function refreshPanel() {
        const token = await getSelectedToken();
        if (!token) {
          tokenNameEl.textContent = '未选中任何 token（请点选一个角色或坐骑）';
          tagsListEl.innerHTML = '';
          statusesListEl.innerHTML = '';
          powersListEl.innerHTML = '';
          return;
        }

        tokenNameEl.textContent = `📌 ${token.name || '未命名'}`;
        const labels = getCustomLabels(token);

        // 标签列表
        tagsListEl.innerHTML = labels.tags.map((tag, i) => `
          <div class="item">
            <span>${escapeHtml(tag.text)}</span>
            <button class="delete-btn" data-type="tag" data-index="${i}">删除</button>
          </div>
        `).join('');

        // 状态列表
        statusesListEl.innerHTML = labels.statuses.map((status, i) => `
          <div class="item">
            <span>${escapeHtml(formatStatus(status))}</span>
            <div class="offset-control">
              <input type="number" id="offset-${i}" value="0" placeholder="-2">
              <button class="offset-btn" data-index="${i}">偏移</button>
            </div>
            <button class="delete-btn" data-type="status" data-index="${i}">删除</button>
          </div>
        `).join('');

        // 威能列表
        powersListEl.innerHTML = labels.powers.map((power, i) => `
          <div class="item">
            <span>${escapeHtml(power.name)} - ${power.level}</span>
            <button class="delete-btn" data-type="power" data-index="${i}">删除</button>
          </div>
        `).join('');

        // 重建该 token 的附件
        await rebuildAttachments(token);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // ----- 事件处理 -----
      document.body.addEventListener('click', async (e) => {
        // 删除按钮
        if (e.target.classList.contains('delete-btn')) {
          const type = e.target.dataset.type;
          const index = parseInt(e.target.dataset.index);
          const token = await getSelectedToken();
          if (!token) return;
          const labels = getCustomLabels(token);
          const arrayMap = { tag: 'tags', status: 'statuses', power: 'powers' };
          const arrayName = arrayMap[type];
          if (!arrayName) return;
          labels[arrayName].splice(index, 1);
          await saveCustomLabels(token, labels);
          refreshPanel();
        }

        // 偏移按钮
        if (e.target.classList.contains('offset-btn')) {
          const index = parseInt(e.target.dataset.index);
          const offsetInput = document.getElementById(`offset-${index}`);
          const delta = parseInt(offsetInput.value);
          if (isNaN(delta)) return alert('请输入有效的整数偏移量');
          const token = await getSelectedToken();
          if (!token) return;
          const labels = getCustomLabels(token);
          const status = labels.statuses[index];
          if (!status) return;

          const newLevels = status.levels.map(l => l + delta)
            .filter(l => l >= 1 && l <= 7);
          
          if (newLevels.length === 0) {
            labels.statuses.splice(index, 1);
          } else {
            const uniqueLevels = [...new Set(newLevels)].sort((a,b) => a-b);
            status.levels = uniqueLevels;
          }
          
          await saveCustomLabels(token, labels);
          refreshPanel();
        }
      });

      // 添加标签
      document.getElementById('add-tag-btn').onclick = async () => {
        const token = await getSelectedToken();
        if (!token) return alert('请先选中一个 token');
        const text = document.getElementById('new-tag').value.trim();
        if (!text) return;
        const labels = getCustomLabels(token);
        labels.tags.push({ id: crypto.randomUUID(), text: text });
        await saveCustomLabels(token, labels);
        document.getElementById('new-tag').value = '';
        refreshPanel();
      };

      // 添加状态
      document.getElementById('add-status-btn').onclick = async () => {
        const token = await getSelectedToken();
        if (!token) return alert('请先选中一个 token');
        const name = document.getElementById('new-status-name').value.trim();
        const level = parseInt(document.getElementById('new-status-level').value);
        if (!name || isNaN(level)) return;
        const labels = getCustomLabels(token);
        let existing = labels.statuses.find(s => s.name === name);
        if (existing) {
          const newLevels = addStatusLevel(existing.levels, level);
          if (!newLevels) return alert('槽位已满，无法添加！');
          existing.levels = newLevels;
        } else {
          if (level < 1 || level > 7) return alert('等级必须在 1-7 之间');
          labels.statuses.push({
            id: crypto.randomUUID(),
            name: name,
            levels: [level]
          });
        }
        await saveCustomLabels(token, labels);
        document.getElementById('new-status-name').value = '';
        document.getElementById('new-status-level').value = '';
        refreshPanel();
      };

      // 添加威能
      document.getElementById('add-power-btn').onclick = async () => {
        const token = await getSelectedToken();
        if (!token) return alert('请先选中一个 token');
        const name = document.getElementById('new-power-name').value.trim();
        const level = parseInt(document.getElementById('new-power-level').value);
        if (!name || isNaN(level)) return;
        const labels = getCustomLabels(token);
        labels.powers.push({ id: crypto.randomUUID(), name: name, level: level });
        await saveCustomLabels(token, labels);
        document.getElementById('new-power-name').value = '';
        document.getElementById('new-power-level').value = '';
        refreshPanel();
      };

      // 监听选中变化
      OBR.player.onChange(refreshPanel);
      // 初始不刷新，等用户选中
      refreshPanel();
    });
  </script>
</body>
</html>
